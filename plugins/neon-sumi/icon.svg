<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Neon Sumi</title>
  <desc>A magenta neon tube lit across an ink brush circle on a dark scroll.</desc>
  <defs>
    <filter id="glow" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <radialGradient id="wash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1E191A"/>
      <stop offset="1" stop-color="#0F0C0D"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0F0C0D"/>
  <circle cx="256" cy="256" r="210" fill="url(#wash)"/>
  <path d="M397 204.7A150 150 0 1 1 307.3 115" fill="none" stroke="#928678" stroke-width="30" stroke-linecap="round"/>
  <rect x="151" y="236" width="210" height="40" rx="20" fill="#FF2EC4" opacity="0.85" filter="url(#glow)"/>
  <rect x="151" y="238" width="210" height="36" rx="18" fill="#FF2EC4"/>
  <rect x="169" y="251" width="174" height="10" rx="5" fill="#FFC2EE"/>
</svg>
